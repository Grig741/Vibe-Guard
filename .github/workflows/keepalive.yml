# Pings the app every ~10 minutes so Render's free instance doesn't fall asleep
# (a sleeping instance takes ~50 s to answer the first visitor).
#
# Setup: repo → Settings → Secrets and variables → Actions → Variables →
#        New variable  VG_URL = https://your-app.onrender.com
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          VG_URL: ${{ vars.VG_URL }}
        run: |
          if [ -z "$VG_URL" ]; then echo "VG_URL variable not set — skipping"; exit 0; fi
          curl -fsS --max-time 90 "$VG_URL/api/health" || echo "ping failed (instance waking up?)"
